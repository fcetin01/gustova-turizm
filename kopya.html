<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Hızlı teklif — kopyala</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F5EF;color:#1F2733;font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
.k{max-width:640px;margin:0 auto}
h1{font-size:1.35rem;color:#1F3858;margin:0 0 6px}
p{margin:0 0 14px;color:#556072}
button{display:block;width:100%;min-height:66px;border:0;border-radius:16px;background:#1FA855;color:#fff;font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer;margin:0 0 14px}
button.ok{background:#1F3858}
textarea{width:100%;min-height:340px;font:15px/1.55 Menlo,Consolas,monospace;border:2px solid #DED8C8;border-radius:14px;padding:14px;background:#fff;color:#1F2733;resize:vertical}
.yok{background:#FCEBEA;color:#8A1F17;padding:14px;border-radius:12px}
</style></head><body><div class="k">
<h1>🤖 Hızlı teklif bloğu</h1>
<p>Kopyalayıp GUSTOVA Claude oturumuna yapıştırın.</p>
<button id="b" type="button">📋 Kopyala</button>
<textarea id="t" readonly></textarea>
</div>
<script>
(function(){
  var t = document.getElementById("t"), b = document.getElementById("b"), metin = "";
  try {
    var h = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
    var ikili = atob(h), bayt = new Uint8Array(ikili.length);
    for (var i = 0; i < ikili.length; i++) bayt[i] = ikili.charCodeAt(i);
    metin = new TextDecoder().decode(bayt);
  } catch (e) {}
  if (!metin) { b.hidden = true; t.hidden = true; document.querySelector("p").outerHTML = '<p class="yok">Bağlantıda blok bulunamadı. E-postadaki kutuyu elle kopyalayın.</p>'; return; }
  t.value = metin;
  function tamam(){ b.textContent = "✓ Kopyalandı — şimdi yapıştırın"; b.className = "ok"; }
  function eski(){ t.focus(); t.select(); t.setSelectionRange(0, metin.length); try { if (document.execCommand("copy")) tamam(); } catch (e) {} }
  b.onclick = function(){
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(metin).then(tamam, eski); else eski();
  };
})();
</script>
</body></html>
